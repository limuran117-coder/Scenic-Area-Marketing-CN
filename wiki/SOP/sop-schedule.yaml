# SOP 定时任务配置
# 管理所有自动化任务的调度规则
# **最后同步：2026-05-27 — 与实际cron时间对齐**

sop_schedule:

  # ─── 抖音指数日报 ───
  - id: douyin-index-daily
    name: 抖音指数日报
    sop: wiki/SOP/抖音指数日报.md
    cron: "0 11 * * *"
    note: "11:00采集发送（平台数据10:00后校准，已从08:00→11:00）"

  # ─── 小红书日报 ───
  - id: xiaohongshu-daily
    name: 小红书日报
    sop: wiki/SOP/小红书日报.md
    cron: "0 10 * * *"
    note: "10:00，站长要求不动"

  # ─── 文旅情报日报（含原文旅活动热点追踪+政策资本）───
  - id: travel-intelligence-daily
    name: 文旅情报日报
    sop: wiki/SOP/文旅活动热点追踪日报.md
    cron: "0 13 * * *"
    note: "13:00，合并原12:00文旅活动+14:00政策资本"

  # ─── 竞品关键词深度分析 ───
  - id: competitor-keyword-deep
    name: 竞品关键词深度分析
    sop: wiki/SOP/竞品关键词深度分析.md
    cron: "0 14 * * *"
    note: "14:00，8大竞品轮换分析"

  # ─── 竞品内容动态 ───
  - id: competitor-content-tracking
    name: 竞品内容动态
    sop: wiki/SOP/竞品内容动态.md
    cron: "0 14 * * *"
    note: "14:00，与关键词分析并行"

  # ─── 竞品爆款拆解 ───
  - id: nationwide-viral-analysis
    name: 竞品爆款拆解
    sop: wiki/SOP/竞品爆款拆解.md
    cron: "0 15 * * *"
    note: "15:00"

  # ─── 每日复盘整合 ───
  - id: daily-review
    name: 每日复盘整合
    sop: wiki/SOP/每日复盘整合.md
    cron: "0 22 * * *"
    note: "22:00"

  # ─── 营销效果归因 ───
  - id: marketing-attribution
    name: 营销效果归因
    cron: "0 7 * * *"
    note: "07:00，仅Wiki不发群"

  # ─── Memory Dreaming ───
  - id: memory-dreaming
    name: Memory Dreaming
    cron: "0 3 * * *"
    note: "03:00，安静时段知识沉淀"

  # ─── 案例库更新 ───
  - id: case-library-update
    name: 案例库更新
    cron: "0 6 * * 3"
    note: "每周三06:00（原每日→改为每周，频率合理）"

# ═══════════════════════════════════════
# 周任务
# ═══════════════════════════════════════

  - id: weekly-passenger-insights
    name: 周度客流营收洞察报告
    sop: wiki/SOP/周度客流营收洞察报告.md
    cron: "30 9 * * 2"
    note: "周二09:30（原周一→周二，因周一拿不到数据）"

  - id: weekly-competitor-landscape
    name: 周度竞争格局报告
    cron: "0 10 * * 0"
    note: "周日10:00"

  - id: weekly-system-upgrade
    name: 周日系统升级+GitHub推送
    cron: "0 9 * * 0"
    note: "周日09:00"

  - id: weekly-wiki-health
    name: Wiki健康检查
    sop: wiki/SOP/Wiki健康检查.md
    cron: "0 12 * * 0"
    note: "周日12:00"

  - id: weekly-code-drift
    name: 代码库Wiki漂移检查
    cron: "0 11 * * 0"
    note: "周日11:00"

  - id: formula-library-update
    name: 爆款公式库更新
    cron: "0 16 * * 0"
    note: "周日16:00"

  - id: marketing-calendar
    name: 电影小镇营销日历
    cron: "0 8 * * 1"
    note: "周一08:00"

# ═══════════════════════════════════════
# 周六任务
# ═══════════════════════════════════════

  - id: weekend-skill-exploration
    name: 周度技能探索
    cron: "0 10 * * 6"
    note: "周六10:00"

  - id: system-evolution-review
    name: 系统进化审视
    cron: "0 10 * * 6"
    note: "周六10:00（与技能探索同时）"

  - id: github-highstar-learning
    name: GitHub高星标内容学习
    cron: "0 0 * * 6"
    note: "周六00:00"

# ═══════════════════════════════════════
# 设备维护
# ═══════════════════════════════════════

  - id: cdp-health-probe
    name: CDP健康探针
    cron: "0 8 * * *"
    note: "08:00，curl+Playwright自动恢复标签页"

  - id: cdp-cookie-sync
    name: CDP Cookie同步
    cron: "5 8 * * *"
    note: "08:05"

